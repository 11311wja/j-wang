<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aurora</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./newtab.css">
  </head>
  <body>
    <div id="app" class="app">
      <div class="background-shell" aria-hidden="true">
        <div id="background-media" class="background-media">
          <div class="background-media__layer is-active"></div>
          <div class="background-media__layer"></div>
        </div>
        <div id="background-dim" class="background-dim"></div>
        <div id="background-frost" class="background-frost"></div>
        <div class="background-grain"></div>
      </div>

      <div id="sticker-layer" class="sticker-layer"></div>
      <div id="floating-layer" class="floating-layer"></div>

      <header class="top-strip">
        <div id="greeting-stack" class="greeting-stack" aria-live="polite">
          <p id="greeting-text" class="greeting-text"></p>
          <p id="greeting-date" class="greeting-date"></p>
        </div>

        <div id="profile-cluster" class="profile-cluster">
          <button id="avatar-button" class="avatar-button" type="button" aria-label="Google account"></button>
        </div>
      </header>

      <main class="scene">
        <section id="search-shell" class="search-shell" aria-label="Search">
          <div class="search-shell__halo" aria-hidden="true"></div>
          <div class="search-box">
            <div class="search-box__icon">
              <svg class="google-g" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M30 16.37c0-1.05-.09-1.82-.29-2.63H16.32v5.05h7.86c-.16 1.26-1.04 3.17-3 4.45l-.03.17 4.41 3.41.31.03C28.7 24.28 30 20.61 30 16.37Z" fill="#4285F4"></path>
                <path d="M16.32 30c3.85 0 7.08-1.27 9.43-3.46l-4.69-3.63c-1.26.88-2.94 1.49-4.74 1.49-3.78 0-6.98-2.49-8.12-5.94l-.16.01-4.58 3.54-.06.15C5.74 26.92 10.63 30 16.32 30Z" fill="#34A853"></path>
                <path d="M8.2 18.46c-.3-.88-.47-1.82-.47-2.78 0-.96.17-1.9.46-2.78l-.01-.19-4.64-3.59-.15.07A14.26 14.26 0 0 0 2 15.68c0 2.3.55 4.48 1.39 6.49l4.81-3.71Z" fill="#FBBC05"></path>
                <path d="M16.32 7c2.27 0 3.81.98 4.69 1.8l3.42-3.34C22.4 3.58 20.17 2.33 16.32 2.33c-5.69 0-10.58 3.08-12.93 7.67l4.8 3.71C9.34 9.49 12.54 7 16.32 7Z" fill="#EA4335"></path>
              </svg>
              <svg class="search-magnifier" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10.5 3a7.5 7.5 0 1 0 4.62 13.4l4.24 4.24 1.41-1.41-4.24-4.24A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11a5.5 5.5 0 0 1 0-11Z"></path>
              </svg>
            </div>

            <input
              id="search-input"
              class="search-box__input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              aria-label="Search Google"
              placeholder="Search Google"
            >

            <div class="search-box__actions">
              <button id="clear-search" class="search-action" type="button" aria-label="Clear search">×</button>
              <button id="voice-search" class="search-action" type="button" aria-label="Voice search">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0a7 7 0 1 1-14 0a1 1 0 1 1 2 0a5 5 0 0 0 10 0Zm-4 8v3h-2v-3h2Z"></path>
                </svg>
              </button>
            </div>
          </div>

          <div id="suggestions-shell" class="suggestions-shell" hidden>
            <ul id="suggestions-list" class="suggestions-list" role="listbox"></ul>
          </div>
        </section>

        <aside id="widget-bar" class="widget-bar" aria-label="Aurora widgets"></aside>
      </main>

      <div class="bottom-left-actions">
        <button id="customize-toggle" class="glass-pill-button" type="button">Customize</button>
        <button id="focus-toggle" class="glass-pill-button glass-pill-button--ghost" type="button">Focus</button>
      </div>

      <p id="focus-hint" class="focus-hint" aria-live="polite">Press Shift+F to exit focus mode</p>

      <aside id="customize-drawer" class="customize-drawer" aria-label="Customize Aurora"></aside>

      <div id="help-overlay" class="help-overlay" hidden></div>
      <div id="modal-root" class="modal-root"></div>
      <div id="onboarding-root" class="onboarding-root" hidden></div>
      <div id="toast-root" class="toast-root" aria-live="polite"></div>
    </div>

    <script type="module" src="./newtab.js"></script>
  </body>
</html>
